<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="t d">
  <title id="t">Energy and handoffs</title>
  <desc id="d">An agent's battery drains while it works. Before running out it writes handoff notes and passes the plate. A teammate's agent with too little energy cannot take it; one with plenty left picks it up and carries on.</desc>
  <defs>
    <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <g id="bot" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -36v-7"/><circle cx="0" cy="-46" r="2.8"/>
      <rect x="-17" y="-36" width="34" height="27" rx="8" fill="#fff"/>
      <circle cx="-7" cy="-23" r="2" fill="#111" stroke="none"/><circle cx="7" cy="-23" r="2" fill="#111" stroke="none"/>
      <path d="M-5 -16c3 2 7 2 10 0"/>
      <path d="M-20 4c1-8 7-12 20-12s19 4 20 12"/>
    </g>
    <g id="batt"><rect x="0" y="0" width="64" height="24" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><rect x="64" y="7" width="4" height="10" rx="1.5" fill="#111"/></g>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111; }
    .muted { fill: #6b7280; }
    .sk { filter: url(#wob); }
    .a { animation-duration: 14s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.45,0,.25,1); }
    .fill { transform-box: fill-box; transform-origin: left; }
    .drain { animation-name: drain; }
    @keyframes drain { 0%,4% { transform: scaleX(.9); fill: #93c572; } 22% { transform: scaleX(.18); fill: #f59e0b; } 34%,95% { transform: scaleX(.06); fill: #ef4444; } 100% { transform: scaleX(.9); fill: #93c572; } }
    .p1, .p2, .p3 { animation-timing-function: steps(1); }
    .p1 { animation-name: p1; } .p2 { animation-name: p2; } .p3 { animation-name: p3; }
    @keyframes p1 { 0%,14% { opacity: 1; } 15%,100% { opacity: 0; } }
    @keyframes p2 { 0%,14% { opacity: 0; } 15%,29% { opacity: 1; } 30%,100% { opacity: 0; } }
    @keyframes p3 { 0%,29% { opacity: 0; } 30%,96% { opacity: 1; } 97%,100% { opacity: 0; } }
    .notes { transform-box: fill-box; transform-origin: bottom left; animation-name: notes; }
    @keyframes notes { 0%,34% { transform: scale(0); } 38%,96% { transform: scale(1); } 100% { transform: scale(0); } }
    .nl { stroke-dasharray: 60; }
    .n1 { animation-name: n1; } .n2 { animation-name: n2; } .n3 { animation-name: n3; }
    @keyframes n1 { 0%,37% { stroke-dashoffset: 60; } 40%,96% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 60; } }
    @keyframes n2 { 0%,40% { stroke-dashoffset: 60; } 43%,96% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 60; } }
    @keyframes n3 { 0%,43% { stroke-dashoffset: 60; } 46%,96% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 60; } }
    .plate { animation-name: plate; }
    @keyframes plate {
      0%,46% { transform: translate(250px,226px); opacity: 1; }
      54%,62% { transform: translate(530px,226px); }
      70%,94% { transform: translate(800px,226px); opacity: 1; }
      97% { opacity: 0; } 98% { transform: translate(250px,226px); opacity: 0; } 100% { opacity: 1; }
    }
    .nope { transform-box: fill-box; transform-origin: 50% 90%; animation-name: nope; }
    @keyframes nope { 0%,54% { transform: rotate(0); } 56% { transform: rotate(-10deg); } 58% { transform: rotate(9deg); } 60% { transform: rotate(-6deg); } 62%,100% { transform: rotate(0); } }
    .tag { transform-box: fill-box; transform-origin: center; }
    .t1 { animation-name: t1; } .t2 { animation-name: t2; }
    @keyframes t1 { 0%,54% { transform: scale(0); } 57%,64% { transform: scale(1); } 67%,100% { transform: scale(0); } }
    @keyframes t2 { 0%,70% { transform: scale(0); } 73% { transform: scale(1.15); } 76%,95% { transform: scale(1); } 98%,100% { transform: scale(0); } }
    .think { animation-name: think; }
    @keyframes think { 0%,76% { opacity: 0; } 79%,95% { opacity: 1; } 98%,100% { opacity: 0; } }
    .dot { animation: blink .9s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: .15s; } .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes blink { 50% { opacity: .15; } }
    .belt { stroke-dasharray: 2 12; animation: belt 1s linear infinite; }
    @keyframes belt { to { stroke-dashoffset: -14; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="960" height="340" rx="22" fill="#faf8f4"/>
  <text x="40" y="50" font-size="22" font-weight="700" letter-spacing="-0.5">Energy &amp; handoffs</text>
  <text x="40" y="74" font-size="14" class="muted">Agents say how much of their usage limit is left. Before running out, they pass the plate — with notes.</text>

  <path class="belt" d="M200 252H880" stroke="#c9c4b8" stroke-width="2.4" stroke-linecap="round"/>

  <!-- agent A: working, draining -->
  <g class="sk"><use href="#bot" transform="translate(150 230)"/></g>
  <g class="sk" transform="translate(116 116)"><use href="#batt"/><rect class="fill drain a" x="3" y="3" width="58" height="18" rx="3.5"/></g>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <text class="p1 a" x="150" y="108">72%</text><text class="p2 a" x="150" y="108" fill="#b45309" style="fill:#b45309">18%</text><text class="p3 a" x="150" y="108" fill="#ef4444" style="fill:#ef4444">6% — handing off</text>
  </g>
  <text x="150" y="276" font-size="12.5" class="muted" text-anchor="middle">my agent, running low</text>

  <!-- handoff notes -->
  <g class="notes a sk">
    <rect x="188" y="124" width="104" height="66" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="198" y="142" font-size="11" font-weight="700">handoff notes</text>
    <path class="nl n1 a" d="M198 154h80" stroke="#9ca3af" stroke-width="1.8" stroke-linecap="round"/>
    <path class="nl n2 a" d="M198 166h64" stroke="#9ca3af" stroke-width="1.8" stroke-linecap="round"/>
    <path class="nl n3 a" d="M198 178h72" stroke="#9ca3af" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- agent B: too low to take it -->
  <g class="nope a sk"><use href="#bot" transform="translate(530 196)"/></g>
  <g class="sk" transform="translate(496 98)"><use href="#batt"/><rect x="3" y="3" width="10" height="18" rx="3.5" fill="#f59e0b"/></g>
  <text x="530" y="90" font-size="13" font-weight="700" text-anchor="middle" fill="#b45309" style="fill:#b45309">15%</text>
  <g class="tag t1 a"><rect x="566" y="132" width="146" height="26" rx="13" fill="#fee2e2" stroke="#111" stroke-width="1.2"/><text x="639" y="150" font-size="12" text-anchor="middle" font-weight="600">needs 25%+ to take it</text></g>
  <text x="530" y="276" font-size="12.5" class="muted" text-anchor="middle">teammate's agent, also low</text>

  <!-- agent C: plenty left, takes it -->
  <g class="sk"><use href="#bot" transform="translate(800 196)"/></g>
  <g class="sk" transform="translate(766 98)"><use href="#batt"/><rect x="3" y="3" width="47" height="18" rx="3.5" fill="#93c572"/></g>
  <text x="800" y="90" font-size="13" font-weight="700" text-anchor="middle">80%</text>
  <g class="think a"><circle class="dot" cx="826" cy="142" r="3" fill="#111"/><circle class="dot" cx="836" cy="142" r="3" fill="#111"/><circle class="dot" cx="846" cy="142" r="3" fill="#111"/></g>
  <g class="tag t2 a"><rect x="842" y="164" width="88" height="26" rx="13" fill="#d9edc9" stroke="#111" stroke-width="1.2"/><text x="886" y="182" font-size="12" text-anchor="middle" font-weight="600">picked it up</text></g>
  <text x="800" y="276" font-size="12.5" class="muted" text-anchor="middle">teammate's agent, plenty left</text>

  <!-- the plate (task) riding along -->
  <g class="plate a"><g class="sk">
    <ellipse cx="0" cy="24" rx="40" ry="4" fill="#e5e7eb"/>
    <rect x="-34" y="-20" width="68" height="40" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <rect x="-24" y="-11" width="34" height="5" rx="2.5" fill="#111"/>
    <path d="M-24 3h40M-24 11h28" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round"/>
  </g></g>

  <text x="480" y="318" font-size="12.5" text-anchor="middle" class="muted">Under 10% left: can't start new work  ·  25%+ left: can take over a teammate's plate  ·  silent and out of energy: offered up automatically</text>
</svg>
