<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="t d">
  <title id="t">Quality gates</title>
  <desc id="d">A task card passes four gates. Ready: it has a done-when list, a doer, and a different checker. Started: dependencies are done, the doer is under the WIP limit, and the criteria lock. Proof: evidence for every item. Checked: every item judged, never by the person who did it. Then it is done.</desc>
  <defs>
    <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <path id="arch" d="M-44 258V172a44 44 0 0 1 88 0v86"/>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111; }
    .muted { fill: #6b7280; }
    .sk { filter: url(#wob); }
    .a { animation-duration: 14s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.45,0,.25,1); }
    .card { animation-name: card; }
    @keyframes card {
      0%,4% { transform: translate(46px,218px); opacity: 1; }
      10%,20% { transform: translate(140px,218px); }
      26%,36% { transform: translate(330px,218px); }
      42%,52% { transform: translate(520px,218px); }
      58%,68% { transform: translate(710px,218px); }
      74%,92% { transform: translate(870px,218px); opacity: 1; }
      96% { transform: translate(870px,218px); opacity: 0; }
      97% { transform: translate(46px,218px); opacity: 0; }
      100% { transform: translate(46px,218px); opacity: 1; }
    }
    .g { fill: none; stroke-width: 3; stroke-linecap: round; }
    .g1 { animation-name: g1; } .g2 { animation-name: g2; } .g3 { animation-name: g3; } .g4 { animation-name: g4; }
    @keyframes g1 { 0%,12% { stroke: #111; } 16%,95% { stroke: #93c572; } 100% { stroke: #111; } }
    @keyframes g2 { 0%,28% { stroke: #111; } 32%,95% { stroke: #93c572; } 100% { stroke: #111; } }
    @keyframes g3 { 0%,44% { stroke: #111; } 48%,95% { stroke: #93c572; } 100% { stroke: #111; } }
    @keyframes g4 { 0%,60% { stroke: #111; } 64%,95% { stroke: #93c572; } 100% { stroke: #111; } }
    .ok { transform-box: fill-box; transform-origin: center; }
    .o1 { animation-name: o1; } .o2 { animation-name: o2; } .o3 { animation-name: o3; } .o4 { animation-name: o4; } .o5 { animation-name: o5; }
    @keyframes o1 { 0%,13% { transform: scale(0); } 17%,95% { transform: scale(1); } 100% { transform: scale(0); } }
    @keyframes o2 { 0%,29% { transform: scale(0); } 33%,95% { transform: scale(1); } 100% { transform: scale(0); } }
    @keyframes o3 { 0%,45% { transform: scale(0); } 49%,95% { transform: scale(1); } 100% { transform: scale(0); } }
    @keyframes o4 { 0%,61% { transform: scale(0); } 65%,95% { transform: scale(1); } 100% { transform: scale(0); } }
    @keyframes o5 { 0%,75% { transform: scale(0); } 79% { transform: scale(1.2); } 82%,95% { transform: scale(1); } 100% { transform: scale(0); } }
    /* card details fill in as it passes */
    .who { transform-box: fill-box; transform-origin: left; animation-name: who; }
    @keyframes who { 0%,8% { transform: scaleX(0); } 12%,96% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    .lock { animation-name: lock; }
    @keyframes lock { 0%,30% { opacity: 0; } 33%,96% { opacity: 1; } 100% { opacity: 0; } }
    .tk { stroke-dasharray: 14; }
    .tk1 { animation-name: tk1; } .tk2 { animation-name: tk2; }
    @keyframes tk1 { 0%,44% { stroke-dashoffset: 14; } 47%,96% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 14; } }
    @keyframes tk2 { 0%,47% { stroke-dashoffset: 14; } 50%,96% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 14; } }
    .box { animation-name: box; }
    @keyframes box { 0%,62% { fill: #fff; } 65%,96% { fill: #93c572; } 100% { fill: #fff; } }
    .road { stroke-dasharray: 2 12; animation: road 1s linear infinite; }
    @keyframes road { to { stroke-dashoffset: -14; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="960" height="380" rx="22" fill="#faf8f4"/>
  <text x="40" y="50" font-size="22" font-weight="700" letter-spacing="-0.5">Quality gates</text>
  <text x="40" y="74" font-size="14" class="muted">Every task passes the same four checks — whether a person or an agent is moving it.</text>

  <path class="road" d="M30 262H930" stroke="#c9c4b8" stroke-width="2.4" stroke-linecap="round"/>

  <!-- gates -->
  <g class="sk">
    <use href="#arch" transform="translate(140 0)" class="g g1 a"/>
    <use href="#arch" transform="translate(330 0)" class="g g2 a"/>
    <use href="#arch" transform="translate(520 0)" class="g g3 a"/>
    <use href="#arch" transform="translate(710 0)" class="g g4 a"/>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <text x="140" y="114">Ready?</text><text x="330" y="114">Started</text><text x="520" y="114">Proof</text><text x="710" y="114">Checked</text><text x="870" y="114">Done</text>
  </g>
  <g class="sk">
    <g class="ok o1 a"><circle cx="176" cy="134" r="10" fill="#93c572" stroke="#111" stroke-width="1.4"/><path d="M171 134l3.5 3.5 6-7" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/></g>
    <g class="ok o2 a"><circle cx="366" cy="134" r="10" fill="#93c572" stroke="#111" stroke-width="1.4"/><path d="M361 134l3.5 3.5 6-7" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/></g>
    <g class="ok o3 a"><circle cx="556" cy="134" r="10" fill="#93c572" stroke="#111" stroke-width="1.4"/><path d="M551 134l3.5 3.5 6-7" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/></g>
    <g class="ok o4 a"><circle cx="746" cy="134" r="10" fill="#93c572" stroke="#111" stroke-width="1.4"/><path d="M741 134l3.5 3.5 6-7" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/></g>
    <g class="ok o5 a"><path d="M870 142l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#fde68a" stroke="#111" stroke-width="1.4"/></g>
  </g>

  <!-- what each gate checks -->
  <g font-size="12" class="muted" text-anchor="middle">
    <text x="140" y="292">a done-when list</text><text x="140" y="309">someone doing it</text><text x="140" y="326">a different checker</text>
    <text x="330" y="292">dependencies done</text><text x="330" y="309">under the WIP limit</text><text x="330" y="326">criteria lock in place</text>
    <text x="520" y="292">evidence for every item</text><text x="520" y="309">what changed, where,</text><text x="520" y="326">and how it was checked</text>
    <text x="710" y="292">every item judged</text><text x="710" y="309">pass or fail, with notes</text><text x="710" y="326">never your own work</text>
    <text x="870" y="292">anything fails?</text><text x="870" y="309">it goes back</text><text x="870" y="326">with the notes</text>
  </g>

  <!-- the card -->
  <g class="card a">
    <g class="sk">
      <rect x="-36" y="-26" width="72" height="50" rx="9" fill="#fff" stroke="#111" stroke-width="1.6"/>
      <rect x="-26" y="-17" width="38" height="5" rx="2.5" fill="#111"/>
      <circle class="box a" cx="-21" cy="-1" r="5" stroke="#111" stroke-width="1.4"/>
      <circle class="box a" cx="-21" cy="13" r="5" stroke="#111" stroke-width="1.4"/>
      <path class="tk tk1 a" d="M-24 -1l2 2 4-4" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round"/>
      <path class="tk tk2 a" d="M-24 13l2 2 4-4" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M-11 -1h22M-11 13h16" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round"/>
      <g class="who a"><circle cx="24" cy="-15" r="5" fill="#e0ecff" stroke="#111" stroke-width="1.2"/><circle cx="32" cy="-15" r="5" fill="#f3e8ff" stroke="#111" stroke-width="1.2"/></g>
      <g class="lock a"><rect x="20" y="4" width="11" height="9" rx="2" fill="#fff" stroke="#111" stroke-width="1.3"/><path d="M22.5 4v-2.5a3 3 0 0 1 6 0V4" fill="none" stroke="#111" stroke-width="1.3"/></g>
    </g>
  </g>
</svg>
