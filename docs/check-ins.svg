<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="t d">
  <title id="t">Check-ins</title>
  <desc id="d">You ask your agent to check in with a teammate. The board answers right away with what it already knows. The question travels to the teammate; their agent answers if it actually knows, otherwise the person does. The answer comes back to your inbox.</desc>
  <defs>
    <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <g id="bot" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -36v-7"/><circle cx="0" cy="-46" r="2.8"/>
      <rect x="-17" y="-36" width="34" height="27" rx="8" fill="#fff"/>
      <circle cx="-7" cy="-23" r="2" fill="#111" stroke="none"/><circle cx="7" cy="-23" r="2" fill="#111" stroke="none"/>
      <path d="M-5 -16c3 2 7 2 10 0"/>
      <path d="M-20 4c1-8 7-12 20-12s19 4 20 12"/>
    </g>
    <g id="person" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-26" r="11" fill="#fff"/>
      <path d="M-4 -27h.1M4 -27h.1"/><path d="M-4 -21c2.5 2 5.5 2 8 0"/>
      <path d="M-20 4c1-9 8-14 20-14s19 5 20 14"/>
    </g>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111; }
    .muted { fill: #6b7280; }
    .sk { filter: url(#wob); }
    .a { animation-duration: 14s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.45,0,.25,1); }
    .pop { transform-box: fill-box; }
    .q { transform-origin: 0% 100%; animation-name: q; }
    @keyframes q { 0%,3% { transform: scale(0); } 7%,94% { transform: scale(1); } 98%,100% { transform: scale(0); } }
    .board { transform-origin: 50% 0%; animation-name: board; }
    @keyframes board { 0%,16% { transform: scale(0); opacity: 0; } 20%,94% { transform: scale(1); opacity: 1; } 98%,100% { transform: scale(0); opacity: 0; } }
    .env { animation-name: env; }
    @keyframes env {
      0%,10% { transform: translate(250px,180px); opacity: 0; }
      12% { opacity: 1; }
      30% { transform: translate(690px,180px); opacity: 1; }
      32%,48% { transform: translate(690px,180px); opacity: 0; }
      50% { transform: translate(690px,180px); opacity: 1; }
      68% { transform: translate(250px,180px); opacity: 1; }
      70%,100% { transform: translate(250px,180px); opacity: 0; }
    }
    .ans { transform-origin: 100% 100%; animation-name: ans; }
    @keyframes ans { 0%,36% { transform: scale(0); } 40%,94% { transform: scale(1); } 98%,100% { transform: scale(0); } }
    .think { animation-name: think; }
    @keyframes think { 0%,30% { opacity: 0; } 32%,38% { opacity: 1; } 40%,100% { opacity: 0; } }
    .dot { animation: blink .9s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: .15s; } .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes blink { 50% { opacity: .15; } }
    .inbox { transform-origin: center; animation-name: inbox; }
    @keyframes inbox { 0%,68% { transform: scale(1); } 71% { transform: scale(1.12); } 74%,100% { transform: scale(1); } }
    .badge { transform-origin: center; animation-name: badge; }
    @keyframes badge { 0%,69% { transform: scale(0); } 72% { transform: scale(1.3); } 75%,94% { transform: scale(1); } 98%,100% { transform: scale(0); } }
    .line { stroke-dasharray: 3 7; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -10; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="960" height="340" rx="22" fill="#faf8f4"/>
  <text x="40" y="50" font-size="22" font-weight="700" letter-spacing="-0.5">Check-ins</text>
  <text x="40" y="74" font-size="14" class="muted">Ask a teammate in plain words. The board answers right away; the real answer comes back to you.</text>

  <!-- you + your agent -->
  <g class="sk"><use href="#person" transform="translate(110 220)"/><use href="#bot" transform="translate(190 220)"/></g>
  <text x="150" y="252" font-size="12.5" class="muted" text-anchor="middle">you &amp; your agent</text>
  <g class="pop q a">
    <rect x="70" y="104" width="230" height="40" rx="14" fill="#d9edc9" stroke="#111" stroke-width="1.3"/>
    <text x="85" y="121" font-size="12.5">“ask them if the directory</text><text x="85" y="136" font-size="12.5">listing is done”</text>
  </g>

  <!-- the path between -->
  <path class="line" d="M250 180H690" stroke="#c9c4b8" stroke-width="2" stroke-linecap="round"/>

  <!-- instant answer from the board -->
  <g class="pop board a sk">
    <rect x="370" y="204" width="220" height="74" rx="12" fill="#fff" stroke="#111" stroke-width="1.4"/>
    <text x="384" y="224" font-size="11.5" font-weight="700">The board already knows</text>
    <rect x="384" y="234" width="90" height="5" rx="2.5" fill="#111"/>
    <text x="384" y="256" font-size="11.5" class="muted">Listing task · in progress</text>
    <text x="384" y="270" font-size="11.5" class="muted">latest update: 2h ago</text>
    <rect x="522" y="228" width="56" height="20" rx="10" fill="#ffedd5"/><text x="550" y="242" font-size="11" text-anchor="middle" fill="#c2410c" style="fill:#c2410c" font-weight="600">doing</text>
  </g>

  <!-- teammate + their agent -->
  <g class="sk"><use href="#bot" transform="translate(770 220)"/><use href="#person" transform="translate(850 220)"/></g>
  <text x="810" y="252" font-size="12.5" class="muted" text-anchor="middle">teammate &amp; their agent</text>
  <g class="think a"><circle class="dot" cx="760" cy="150" r="3" fill="#111"/><circle class="dot" cx="770" cy="150" r="3" fill="#111"/><circle class="dot" cx="780" cy="150" r="3" fill="#111"/></g>
  <g class="pop ans a">
    <rect x="608" y="96" width="312" height="44" rx="14" fill="#f3e8ff" stroke="#111" stroke-width="1.3"/>
    <text x="622" y="114" font-size="12.5">“Most of it — the rest by Friday.”</text>
    <text x="622" y="130" font-size="11" class="muted">answered by their agent, from the task's progress</text>
  </g>

  <!-- envelope travelling -->
  <g class="env a"><g class="sk">
    <rect x="-14" y="-10" width="28" height="20" rx="3" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <path d="M-14 -9 0 2 14 -9" fill="none" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/>
  </g></g>

  <!-- your inbox -->
  <g class="pop inbox a sk">
    <rect x="44" y="274" width="132" height="34" rx="17" fill="#fff" stroke="#111" stroke-width="1.4"/>
    <text x="64" y="296" font-size="12.5" font-weight="600">Home · answers</text>
  </g>
  <g class="pop badge a"><circle cx="176" cy="276" r="10" fill="#93c572" stroke="#111" stroke-width="1.3"/><text x="176" y="280.5" font-size="11.5" font-weight="700" text-anchor="middle">1</text></g>

  <text x="600" y="318" font-size="12.5" text-anchor="middle" class="muted">Agents only answer from what they actually know — otherwise the question waits for the person.</text>
</svg>
